<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沉下去的黄昏</title>
<meta name="description" content="记录代码、折腾与生活。慢慢来，也是一种前进。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航：由 site.js 生成，三页一致 -->
<header id="nav" class="nav"></header>

<main>
  <!-- 首屏 -->
  <section class="hero wrap">
    <div class="avatar-wrap fade">
      <img class="avatar" src="avatar.svg" alt="沉下去的黄昏的头像" width="104" height="104">
    </div>
    <h1 class="fade" style="--fd:1"><span class="hi">沉下去的黄昏</span></h1>
    <p class="slogan fade" style="--fd:2">记录代码、折腾与生活<br>慢慢来，也是一种前进</p>
    <!-- 社交图标由 site.js 填 -->
    <div class="socials" id="socials"></div>
  </section>

  <!-- 关于我 -->
  <section class="section wrap">
    <div class="section-head fade">
      <h2>关于我</h2><span class="en">About</span><span class="bar"></span>
    </div>
    <div class="about" id="about"></div>
  </section>

  <!-- 作品 -->
  <section class="section wrap">
    <div class="section-head fade">
      <h2>作品</h2><span class="en">Works</span><span class="bar"></span>
    </div>
    <div class="grid" id="works"></div>
  </section>

  <!-- 友链 -->
  <section class="section wrap">
    <div class="section-head fade">
      <h2>朋友们</h2><span class="en">Links</span><span class="bar"></span>
    </div>
    <div class="grid" id="links"></div>
    <p class="fade" style="color:var(--ink-3);font-size:13px;margin-top:16px">
      想交换友链的话，去 <a href="留言.html">留言板</a> 或 <a href="联系.html">联系页</a> 说一声。
    </p>
  </section>
</main>

<footer id="foot" class="foot wrap"></footer>

<script src="site.js"></script>
</body>
</html>
